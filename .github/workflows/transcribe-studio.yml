name: Transcribe Studio

# Word-level timings for narration, used to time subtitles.
# Push studio/transcribe.json ({"files": ["mae-ep1.mp3", ...], "run": N}) to start.
on:
  workflow_dispatch:
  push:
    branches: [claude/studio-2.5d]
    paths: ['studio/transcribe.json']

permissions:
  contents: write

jobs:
  whisper:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install -q faster-whisper==1.1.1
      - name: Transcribe
        working-directory: studio
        run: |
          mkdir -p clips/words
          python3 - <<'PY'
          import json
          from faster_whisper import WhisperModel
          files = json.load(open('transcribe.json'))['files']
          m = WhisperModel('large-v3', device='cpu', compute_type='int8')
          for f in files:
              segs, info = m.transcribe(f'public/audio/{f}', language='th', word_timestamps=True, beam_size=5, vad_filter=False)
              words = [{'w': w.word, 's': round(w.start, 3), 'e': round(w.end, 3)} for s in segs for w in (s.words or [])]
              out = 'clips/words/' + f.rsplit('.', 1)[0] + '.json'
              json.dump({'audio': f, 'words': words}, open(out, 'w'), ensure_ascii=False, indent=0)
              print(f, len(words), 'words')
          PY
      - name: Commit timings
        run: |
          git config user.name "studio-bot"
          git config user.email "studio-bot@users.noreply.github.com"
          git add studio/clips/words
          git commit -m "studio: whisper word timings" || exit 0
          git pull --rebase origin claude/studio-2.5d
          git push origin HEAD:claude/studio-2.5d
