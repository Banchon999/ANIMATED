name: Render Studio

on:
  workflow_dispatch:
  push:
    branches: [claude/studio-2.5d]
    paths: ['studio/render.json', '.github/workflows/render-studio.yml']

concurrency:
  group: render-studio-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      parts: ${{ steps.plan.outputs.parts }}
      comps: ${{ steps.plan.outputs.comps }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        working-directory: studio
        run: node scripts/plan.mjs >> "$GITHUB_OUTPUT"

  # Each part is a short frame range rendered in its own fresh browser, in parallel.
  render:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        include: ${{ fromJson(needs.plan.outputs.parts) }}
    defaults:
      run:
        working-directory: studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - run: npm ci
      - name: Render ${{ matrix.comp }} part ${{ matrix.part }}
        env:
          RENDER_CONCURRENCY: '3'
        run: |
          mkdir -p out/parts
          for attempt in 1 2 3; do
            if npx remotion render "${{ matrix.comp }}" "out/parts/${{ matrix.comp }}-${{ matrix.part }}.mp4" ${{ matrix.range }} --muted --crf=18 --timeout=120000; then
              exit 0
            fi
            echo "::warning::attempt $attempt failed for ${{ matrix.comp }} part ${{ matrix.part }}"
            rm -f "out/parts/${{ matrix.comp }}-${{ matrix.part }}.mp4"
            sleep 5
          done
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: part-${{ matrix.comp }}-${{ matrix.part }}
          path: studio/out/parts/*.mp4
          retention-days: 1
          if-no-files-found: error

  assemble:
    needs: [plan, render]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.plan.outputs.comps) }}
    defaults:
      run:
        working-directory: studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: part-${{ matrix.comp }}-*
          path: studio/out/parts
          merge-multiple: true
      - name: Install ffmpeg if missing
        run: command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      - name: Join parts and add narration
        run: node scripts/assemble.mjs "${{ matrix.comp }}" "${{ matrix.audio }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.comp }}-${{ github.run_number }}
          path: studio/out/final/*.mp4
          retention-days: 14
          if-no-files-found: error
